    <path class="edge" d="M695 349 H720 V206 H795"/><text class="cardinality" x="703" y="369">1</text><text class="cardinality" x="761" y="197">0..1</text>
    <path class="edge" d="M695 393 H758 V360 H795"/><text class="cardinality" x="703" y="384">1</text><text class="cardinality" x="761" y="351">0..1</text>
    <path class="edge" d="M695 437 H744 V525 H795"/><text class="cardinality" x="703" y="428">1</text><text class="cardinality" x="761" y="516">0..1</text>
