<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="985" viewBox="0 0 1530 985" role="img" aria-labelledby="title desc">
  <title id="title">ER-діаграма нормалізованої бази даних гуртожитків</title>
  <desc id="desc">Тринадцять таблиць із первинними, зовнішніми та унікальними ключами й кратностями зв'язків.</desc>
  <style>
    .title{font:700 32px 'Segoe UI',sans-serif;fill:#12304a}
    .legend{font:16px 'Segoe UI',sans-serif;fill:#36536c}
    .name{font:700 18px 'Segoe UI',sans-serif;fill:#fff}
    .field{font:15px Consolas,'DejaVu Sans Mono',monospace;fill:#183952}
    .edge{fill:none;stroke:#48758b;stroke-width:2}
    .cardinality{font:700 12px 'Segoe UI',sans-serif;fill:#204d66;paint-order:stroke;stroke:#f1f6f9;stroke-width:4;stroke-linejoin:round}
  </style>
  <rect width="1530" height="985" fill="#f1f6f9"/>
  <text class="title" x="65" y="55">Облік гуртожитків · ER-діаграма після нормалізації</text>
  <text class="legend" x="65" y="83">PK — первинний ключ · FK — зовнішній ключ · UQ — унікальність · N — багато</text>
  <g aria-label="Зовнішні ключі">
