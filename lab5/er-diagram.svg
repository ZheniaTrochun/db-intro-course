    <path class="edge" d="M335 687 H425"/><text class="cardinality" x="343" y="678">1</text><text class="cardinality" x="391" y="678">0..N</text>
    <path class="edge" d="M335 862 H425"/><text class="cardinality" x="343" y="853">1</text><text class="cardinality" x="391" y="853">0..N</text>
    <path class="edge" d="M1065 161 H1165"/><text class="cardinality" x="1073" y="152">1</text><text class="cardinality" x="1131" y="152">0..N</text>
